services:
  - type: web
    name: pdd
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: TZ
        value: Asia/Shanghai
      - key: OCR_MAX_CONCURRENT
        value: "1"
      - key: OCR_RATE_LIMIT_PER_MINUTE
        value: "3"
      - key: OCR_RATE_LIMIT_PER_DAY
        value: "20"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DATA_DIR
        value: "."
